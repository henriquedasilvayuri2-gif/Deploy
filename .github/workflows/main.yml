name: Deploy Windows 10 RDP

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Azure Login
        uses: azure/login@v2
        with:
          creds: ${{ secrets.AZURE_CREDENTIALS }}

      - name: Create Resource Group
        uses: azure/cli@v2
        with:
          inlineScript: |
            az group create \
              --name rg-win10-rdp \
              --location eastus

      - name: Deploy Bicep
        uses: azure/cli@v2
        env:
          VM_ADMIN_USER: ${{ secrets.VM_ADMIN_USER }}
          VM_ADMIN_PASSWORD: ${{ secrets.VM_ADMIN_PASSWORD }}
        with:
          inlineScript: |
            az deployment group create \
              --resource-group rg-win10-rdp \
              --template-file infra/main.bicep \
              --parameters \
                adminUsername="$VM_ADMIN_USER" \
                adminPassword="$VM_ADMIN_PASSWORD"

      - name: Show VM IP
        uses: azure/cli@v2
        with:
          inlineScript: |
            az vm show \
              --resource-group rg-win10-rdp \
              --name win10-rdp \
              --show-details \
              --query publicIps \
              --output tsv
